name: Publish

on:
  workflow_dispatch:
    inputs:
      verification_run_id:
        description: Successful Release candidate run ID for this exact commit
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  gate:
    name: Require a verified candidate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      artifact: ${{ steps.verify.outputs.artifact }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Check successful workflow and exact commit
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFICATION_RUN_ID: ${{ inputs.verification_run_id }}
        run: node .github/scripts/verify-release-run.mjs

  publish:
    name: Publish verified npm package
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Download the verified package
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.gate.outputs.artifact }}
          run-id: ${{ inputs.verification_run_id }}
          github-token: ${{ github.token }}
          path: release
      - name: Verify package checksum
        working-directory: release
        run: sha256sum --check SHA256SUMS
      - name: Publish without rebuilding or lifecycle scripts
        run: npm publish ./release/package.tgz --access public --ignore-scripts
